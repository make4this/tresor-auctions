# Style repris d'Imoframe (imoframe.com, autre projet de l'étudiant) : fond blanc cassé, cartes
# gris clair, bleu marine, coins carrés, titres Inter demi-gras, texte DM Sans.
[theme]
base = "light"
primaryColor = "#172A45"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F0F0EF"
textColor = "#111111"
linkColor = "#172A45"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap, sans-serif"
headingFontWeights = 500
baseRadius = "none"
borderColor = "#E4E3DF"
dataframeHeaderBackgroundColor = "#F0F0EF"

[theme.sidebar]
backgroundColor = "#F5F5F4"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
