# Couleurs reprises d'Imoframe (imoframe.com, autre projet de l'étudiant) : fond blanc cassé,
# cartes gris clair, bleu marine. Polices et coins carrés : voir app_ui.page_style.
[theme]
base = "light"
primaryColor = "#172A45"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F0F0EF"
textColor = "#111111"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
