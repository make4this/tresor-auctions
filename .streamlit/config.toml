# Couleurs du tableau de bord : fond gris clair, panneaux blancs, bleu d'accent. La barre
# latérale foncée, les polices et les panneaux sont en CSS (app_ui.page_style) : ici, seules les
# couleurs simples, que Streamlit Community Cloud accepte.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#EEF1F5"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#111827"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
