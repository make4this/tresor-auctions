# Tests et style à chaque envoi de code (pas pour les données enregistrées le soir).
name: Tests

on:
  push:
    branches: [main]  # les autres branches sont testées par leur pull request
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # lecture seule : ce workflow n'écrit rien

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 : passage du soir ; 3.14 : Python de l'application sur Streamlit Community Cloud
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install --no-deps -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Style
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest -q
