# Tests et style à chaque envoi de code (pas pour les données enregistrées le soir).
name: Tests

on:
  push:
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Style
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest -q
