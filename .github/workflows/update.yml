# Passage du soir : télécharge les données, nettoie, réentraîne si besoin, prévoit les enchères
# à venir, vérifie le journal figé, dépose les modèles dans la release, puis enregistre les
# données dans le dépôt.
name: Mise à jour du soir

on:
  schedule:
    - cron: "17 23 * * 1-5"  # 23 h 17 UTC du lundi au vendredi (18 h 17 ou 19 h 17 à New York)
  workflow_dispatch:  # lancement à la main depuis l'onglet Actions

permissions:
  contents: write  # pour enregistrer les données et déposer les modèles

concurrency:
  group: mise-a-jour  # jamais deux passages en même temps : un seul programme écrit le journal
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'  # jamais depuis une autre branche
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      # Actions figées par l'empreinte de leur commit : une étiquette (v7) peut être déplacée.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # le jeton n'est donné qu'aux étapes qui écrivent

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Toutes les versions sont figées : rien n'est résolu ici, et `pip check` refuse un
      # ensemble incomplet ou incohérent.
      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install --no-deps -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Garder une copie du journal d'avant
        run: |
          if [ -f data/output/predictions_log.parquet ]; then
            cp data/output/predictions_log.parquet "$RUNNER_TEMP/journal_avant.parquet"
          fi

      # Code 0 : tout a tourné. Code 3 : des sources ont échoué au téléchargement, tout le reste
      # a tourné avec leurs dernières données ; on réessaie une fois 10 minutes plus tard (les
      # pannes du Trésor sont souvent courtes), puis on enregistre quand même, avec un
      # avertissement. Autre code : erreur bloquante, rien n'est enregistré.
      - name: Télécharger, nettoyer, entraîner, prévoir
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e
          python -m tresor.pipeline --fetch --clean --train --predict
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "Des sources ont échoué : nouvel essai dans 10 minutes."
            sleep 600
            python -m tresor.pipeline --fetch --clean --train --predict
            code=$?
          fi
          if [ "$code" -eq 3 ]; then
            echo "::warning title=Source en panne::Des sources n'ont pas pu être téléchargées (détail : data/output/fetch_status.json). La prévision utilise leurs dernières données."
          elif [ "$code" -ne 0 ]; then
            echo "::error title=Erreur bloquante::Le pipeline s'est arrêté (code $code) : rien n'est enregistré."
            exit "$code"
          fi

      - name: Vérifier le journal figé
        run: python -m tresor.check_log "$RUNNER_TEMP/journal_avant.parquet" data/output/predictions_log.parquet

      # Les modèles (8,6 Mo) ne sont pas commités : ils vont dans une « release » du dépôt, sous
      # un nom tiré de leur empreinte. Le fichier qui annonce ce nom (models_release.json) n'est
      # mis à jour qu'une fois l'archive déposée : l'application ne demande jamais une archive
      # absente. Un échec ici n'empêche pas d'enregistrer les données (signalé à la fin).
      - name: Publier les modèles dans la release
        id: release
        if: hashFiles('data/models/metadata.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Modèles entraînés par le passage du soir. L'archive à utiliser est celle que nomme data/output/models_release.json (nom tiré de son empreinte SHA-256). Les archives « Source code » de cette release ne servent pas : le code est sur la branche main."
          asset=$(python -m tresor.models_store pack data/models "$RUNNER_TEMP/modeles")
          if gh release view modeles-du-soir > /dev/null 2>&1; then
            gh release edit modeles-du-soir --notes "$notes" --latest=false
          else
            gh release create modeles-du-soir --title "Modèles du soir" --latest=false --notes "$notes"
          fi
          # Une archive déjà déposée sous ce nom est identique (même empreinte) : on la garde.
          names=$(gh release view modeles-du-soir --json assets --jq '.assets[].name')
          if ! printf '%s\n' "$names" | grep -x "$asset" > /dev/null; then
            gh release upload modeles-du-soir "$RUNNER_TEMP/modeles/$asset"
          fi
          previous=$(python -c "import json; print(json.load(open('data/output/models_release.json'))['asset'])" 2>/dev/null || true)
          cp "$RUNNER_TEMP/modeles/models_release.json" data/output/models_release.json
          echo "current=$asset" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      # Si quelqu'un a poussé entre-temps, on se replace après son travail et on revérifie le
      # journal avant de réessayer.
      - name: Enregistrer les données
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau ce soir."
            exit 0
          fi
          git commit -m "Données du $(TZ=America/New_York date +%Y-%m-%d)"
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for attempt in 1 2 3; do
            if git -c "$auth" push origin HEAD:main; then
              exit 0
            fi
            sleep 10
            git -c "$auth" pull --rebase origin main
            python -m tresor.check_log "$RUNNER_TEMP/journal_avant.parquet" data/output/predictions_log.parquet
          done
          echo "::error title=Envoi impossible::Les données n'ont pas pu être poussées."
          exit 1

      # On garde l'archive du soir et celle d'avant (encore annoncée si l'envoi avait échoué).
      - name: Retirer les anciennes archives de modèles
        if: steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.release.outputs.current }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          gh release view modeles-du-soir --json assets --jq '.assets[].name' | while read -r name; do
            if [ "$name" != "$CURRENT" ] && [ "$name" != "$PREVIOUS" ]; then
              gh release delete-asset modeles-du-soir "$name" --yes
            fi
          done

      - name: Signaler un problème à corriger
        if: always()
        env:
          RELEASE: ${{ steps.release.outcome }}
        run: |
          problem=0
          if [ "$RELEASE" = "failure" ]; then
            echo "::error title=Modèles::Les modèles n'ont pas pu être déposés : l'application en ligne garde ceux de la veille."
            problem=1
          fi
          quality=$(python -c "import json; print(json.load(open('data/output/data_quality.json'))['status'])" 2>/dev/null || echo "absent")
          echo "Contrôle qualité : $quality"
          if [ "$quality" = "rouge" ] || [ "$quality" = "absent" ]; then
            echo "::error title=Qualité des données::Contrôle qualité « $quality » : voir la page Qualité de l'application."
            problem=1
          fi
          exit "$problem"
