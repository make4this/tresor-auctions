# Passage du soir : télécharge les données, nettoie, réentraîne si besoin, prévoit les enchères
# à venir, vérifie que le journal figé n'a pas changé, puis enregistre les données dans le dépôt.
name: Mise à jour du soir

on:
  schedule:
    - cron: "17 23 * * 1-5"  # 23 h 17 UTC du lundi au vendredi (18 h 17 ou 19 h 17 à New York)
  workflow_dispatch:  # lancement à la main depuis l'onglet Actions

permissions:
  contents: write  # pour enregistrer les données

concurrency:
  group: mise-a-jour  # jamais deux passages en même temps : un seul programme écrit le journal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Garder une copie du journal d'avant
        run: cp data/output/predictions_log.parquet "$RUNNER_TEMP/journal_avant.parquet"

      # Une source en panne n'arrête pas la suite : on prévoit avec les dernières données
      # disponibles, et l'échec est signalé à la fin.
      - name: Télécharger, nettoyer, entraîner, prévoir
        id: pipeline
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m tresor.pipeline --fetch --clean --train --predict

      - name: Vérifier qu'aucune ligne figée du journal n'a changé
        run: python -m tresor.check_log "$RUNNER_TEMP/journal_avant.parquet" data/output/predictions_log.parquet

      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau ce soir."
          else
            git commit -m "Données du $(TZ=America/New_York date +%Y-%m-%d)"
            git push
          fi

      # Les modèles (8,6 Mo) ne sont pas commités : ils vont dans une « release » du dépôt,
      # remplacée chaque soir, où l'application en ligne les télécharge.
      - name: Publier les modèles dans la release
        if: hashFiles('data/models/metadata.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "from pathlib import Path; from tresor.models_store import archive; archive(Path('data/models'), Path('$RUNNER_TEMP/modeles.tar.gz'))"
          gh release view modeles-du-soir > /dev/null 2>&1 || gh release create modeles-du-soir \
            --title "Modèles du soir" --latest=false \
            --notes "Modèles entraînés par le passage du soir ; l'archive est remplacée chaque soir."
          gh release upload modeles-du-soir "$RUNNER_TEMP/modeles.tar.gz" --clobber

      - name: Signaler un échec du pipeline
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "Le pipeline a signalé une erreur (voir l'étape « Télécharger, nettoyer, entraîner, prévoir »)."
          echo "Les données disponibles ont quand même été enregistrées."
          exit 1
