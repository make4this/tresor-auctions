# Contrôle du journal figé pour un envoi fait à la main. Le passage du soir le vérifie déjà
# lui-même (ses envois ne relancent pas les workflows) ; ici, tout autre envoi sur main qui
# touche au journal est comparé à la version d'avant. Le contrôle vient après l'envoi : il ne
# l'empêche pas, il le signale en rouge, et la version d'avant se restaure avec git.
name: Contrôle du journal figé

on:
  push:
    branches: [main]
    paths:
      - "data/output/predictions_log.parquet"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install --no-deps -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Comparer au journal d'avant l'envoi
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE"
          if ! git show "$BEFORE:data/output/predictions_log.parquet" > "$RUNNER_TEMP/avant.parquet" 2>/dev/null; then
            echo "Pas de journal avant cet envoi : rien à comparer."
            exit 0
          fi
          python -m tresor.check_log "$RUNNER_TEMP/avant.parquet" data/output/predictions_log.parquet
