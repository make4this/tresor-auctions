[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tresor-auctions"
version = "0.1.0"
description = "Prévoir la qualité des adjudications du Trésor américain avec des données publiques."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "joblib>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.22",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "scikit-learn>=1.7",  # LassoCV(alphas=30) : nombre d'alphas
    "shap>=0.45",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/tresor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
